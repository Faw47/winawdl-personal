# What can be checked with no radio: the AirDrop layer over loopback, the AWDL
# daemon's build and tests, and the app's own checks. The driver and the radio
# daemon need the Windows Driver Kit, vcpkg and the card, and are not built here.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  airdrop:
    name: AirDrop layer, Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README names, and the one it is written on.
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Style
        run: |
          python -m pip install ruff==0.15.10
          python -m ruff check airdrop
      - name: Tests, over loopback
        run: python -m unittest discover -s airdrop\tests

  radio:
    name: Windows RTL8852CE radio build (no hardware)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Windows PCIe devourer sources
        shell: pwsh
        run: git submodule update --init upstream/devourer
      - name: Locate vcpkg
        shell: pwsh
        run: |
          $roots = @($env:VCPKG_INSTALLATION_ROOT, 'C:\vcpkg', 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\vcpkg', 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\vcpkg')
          $root = $roots | Where-Object { $_ -and (Test-Path (Join-Path $_ 'vcpkg.exe')) } | Select-Object -First 1
          if (-not $root) { throw 'vcpkg.exe unavailable on this runner' }
          "VCPKG_ROOT=$root" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      - name: Load installed MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Build Windows radio and its hardware-free tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S radio -B build/radio -G Ninja -DCMAKE_BUILD_TYPE=Release "-DVCPKG_MANIFEST_DIR=$PWD/deps"
          if ($LASTEXITCODE -ne 0) { throw 'radio configure failed' }
          cmake --build build/radio --target winawdl_radio channel_width_test ack_cam_experiment_test
          if ($LASTEXITCODE -ne 0) { throw 'radio build failed' }
      - name: Headless RTL8852CE radio tests
        shell: pwsh
        run: |
          & build/radio/ack_cam_experiment_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'CAM selftest failed' }
          & build/radio/channel_width_test.exe
          if ($LASTEXITCODE -ne 0) { throw 'subcarrier test failed' }

  awdl:
    name: AWDL daemon, with OWL patched
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - name: OWL, without the vendor trees a recursive clone would pull
        shell: pwsh
        run: |
          git submodule update --init upstream/owl
          git -C upstream/owl submodule update --init radiotap
          git submodule update --init upstream/devourer
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Git for Windows stays on the path: the build applies OWL's patches with it.
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build, which applies awdl/patches
        run: |
          cmake -S awdl -B build/awdl -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/awdl
      - name: Tests
        run: |
          set -e
          for test in rx_amsdu_bounds_test election_order_test peer_heard_test host_frame_test \
                      tcp_merge_test frame_fixup_test service_bridge_test redact_test psf_ht_test; do
            echo "== $test"
            ./build/awdl/$test.exe
          done
      - name: Portable RTL8852C CAM63 and TX subcarrier tests
        run: |
          set -e
          g++ -std=c++20 -Wall -Wextra -Werror radio/tests/ack_cam_experiment_test.cpp -o build/awdl/ack_cam_experiment_test.exe
          ./build/awdl/ack_cam_experiment_test.exe
          g++ -std=c++20 -Wall -Wextra -Werror -Iupstream/devourer/src radio/tests/channel_width_test.cpp -o build/awdl/channel_width_test.exe
          ./build/awdl/channel_width_test.exe

  fuzz:
    name: Fuzzing what a stranger sends, a minute a target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: OWL, without the vendor trees a recursive clone would pull
        run: |
          git submodule update --init upstream/owl
          git -C upstream/owl submodule update --init radiotap
      - name: The patched copy of OWL
        run: cmake -S awdl -B build/awdl
      - name: Fuzz
        run: awdl/fuzz/run.sh 60

  app:
    name: Windows app
    runs-on: windows-latest
    # To publish the screens to their branch below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build app\winawdl.csproj -c Release -nologo
      - name: Checks that need no radio and no window
        shell: pwsh
        run: |
          $out = "$PWD\build\app\check"
          # The app has no console, so its exit is waited for and its log read.
          $run = Start-Process build\app\winawdl\winawdl.exe -ArgumentList '--check', "`"$out`"" -Wait -PassThru
          if (Test-Path "$out\check.log") { Get-Content "$out\check.log" }
          exit $run.ExitCode
      - name: Draw every screen, light and dark
        shell: pwsh
        run: |
          $out = "$PWD\build\screens"
          $run = Start-Process build\app\winawdl\winawdl.exe -ArgumentList '--render', "`"$out`"" -Wait -PassThru
          if ($run.ExitCode -ne 0) { exit $run.ExitCode }
          Get-ChildItem $out -Filter *.png | Measure-Object | Select-Object -ExpandProperty Count
      - name: Publish the screens to a branch of their own
        # Only for this repository's own branches: a fork's pull request gets
        # no token that may write, and should not.
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'screens-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build\screens\*.png $dir
          Set-Location $dir
          git init -q -b screens
          git config user.name 'winawdl CI'
          git config user.email 'ci@users.noreply.github.com'
          git add -A
          git commit -q -m "Screens of $env:SOURCE at $env:COMMIT"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/$env:REPOSITORY" "HEAD:refs/heads/ci-screens/$env:SOURCE"
      - name: Save the screens
        uses: actions/upload-artifact@v4
        with:
          name: screens-${{ github.sha }}
          path: build/screens/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Save Windows app files
        uses: actions/upload-artifact@v4
        with:
          name: winawdl-gui-${{ github.sha }}
          path: build/app/winawdl/
          if-no-files-found: error
          retention-days: 14
