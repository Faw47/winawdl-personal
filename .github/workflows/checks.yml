# What can be checked with no radio: the AirDrop layer over loopback, the AWDL
# daemon's build and tests, and the app's own checks. The driver and the radio
# daemon need the Windows Driver Kit, vcpkg and the card, and are not built here.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  airdrop:
    name: AirDrop layer, Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README names, and the one it is written on.
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Style
        run: |
          python -m pip install ruff==0.15.10
          python -m ruff check airdrop
      - name: Tests, over loopback
        run: python -m unittest discover -s airdrop\tests

  awdl:
    name: AWDL daemon, with OWL patched
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - name: OWL, without the vendor trees a recursive clone would pull
        shell: pwsh
        run: |
          git submodule update --init upstream/owl
          git -C upstream/owl submodule update --init radiotap
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Git for Windows stays on the path: the build applies OWL's patches with it.
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Build, which applies awdl/patches
        run: |
          cmake -S awdl -B build/awdl -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/awdl
      - name: Tests
        run: |
          set -e
          for test in rx_amsdu_bounds_test election_order_test peer_heard_test host_frame_test \
                      tcp_merge_test frame_fixup_test service_bridge_test redact_test; do
            echo "== $test"
            ./build/awdl/$test.exe
          done

  fuzz:
    name: Fuzzing what a stranger sends, a minute a target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: OWL, without the vendor trees a recursive clone would pull
        run: |
          git submodule update --init upstream/owl
          git -C upstream/owl submodule update --init radiotap
      - name: The patched copy of OWL
        run: cmake -S awdl -B build/awdl
      - name: Fuzz
        run: awdl/fuzz/run.sh 60

  app:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build app\winawdl.csproj -c Release -nologo
      - name: Checks that need no radio and no window
        shell: pwsh
        run: |
          $out = "$PWD\build\app\check"
          # The app has no console, so its exit is waited for and its log read.
          $run = Start-Process build\app\winawdl\winawdl.exe -ArgumentList '--check', "`"$out`"" -Wait -PassThru
          if (Test-Path "$out\check.log") { Get-Content "$out\check.log" }
          exit $run.ExitCode
      - name: Save Windows app files
        uses: actions/upload-artifact@v4
        with:
          name: winawdl-gui-${{ github.sha }}
          path: build/app/winawdl/
          if-no-files-found: error
          retention-days: 14
